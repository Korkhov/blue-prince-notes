<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blue Prince — заметки</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <style>
    :root { --theme-color: #2f5bd3; }
    .markdown-section img { max-width: 100%; border-radius: 6px; margin: 6px 0; }
    .markdown-section details { background: #f6f7fb; border-radius: 8px; padding: 8px 12px; margin: 12px 0; }
    .markdown-section summary { cursor: pointer; }
    .sidebar ul li a { white-space: normal; }
    @media (max-width: 768px) { .markdown-section { padding: 24px 16px 40px; } }
    @media (prefers-color-scheme: dark) {
      body, .sidebar, .markdown-section { background: #15171c; color: #d8dbe2; }
      .sidebar ul li a, .markdown-section p, .markdown-section li { color: #c8ccd6; }
      .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section strong { color: #eef0f5; }
      .markdown-section details, .markdown-section blockquote, .markdown-section tr:nth-child(2n) { background: #1e2129; }
      .markdown-section code { background: #232733; color: #e6e6e6; }
      .search input { background: #1e2129; color: #ddd; }
      .sidebar-toggle { background-color: rgba(21,23,28,.8); }
    }
  </style>
</head>
<body>
  <div id="app">Загрузка…</div>
  <script src="search-paths.js"></script>
  <script>
    window.$docsify = {
      name: 'Blue Prince — заметки',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      relativePath: true,
      subMaxLevel: 0,
      auto2top: true,
      search: { paths: window.SEARCH_PATHS || 'auto', placeholder: 'Поиск…', noData: 'Ничего не найдено', depth: 3, maxAge: 3600000 },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
